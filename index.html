function fmt(n){const c=db.settings.cur,iq=c==='IQD';return new Intl.NumberFormat('en-US',{minimumFractionDigits:iq?0:2,maximumFractionDigits:iq?0:2}).format(n)+' '+c}
const bal=id=>db.tx.reduce((s,x)=>x.cid===id?s+(x.type==='debt'?x.amount:-x.amount):s,0);

function homeHTML(){

 const total=owed.reduce((s,r)=>s+r.b,0);
 const top=owed.sort((a,b)=>b.b-a.b).slice(0,5);
 const rec=[...db.tx].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,8);
 return `${pendHTML()}${dueHTML()}<div class="grid">
 <div class="card stat red"><div class="l">${t('totalOwed')}</div><div class="v">${fmt(total)}</div></div>
 <div class="card stat"><div class="l">${t('debtors')}</div><div class="v">${owed.length}</div></div>
 <div class="card stat"><div class="l">${t('customersCount')}</div><div class="v">${db.customers.length}</div></div></div>
 <div class="grid">${(()=>{const td=today(),T=db.tx.filter(x=>x.date===td),D=T.filter(x=>x.type==='debt').reduce((a,x)=>a+x.amount,0),P=T.filter(x=>x.type==='payment').reduce((a,x)=>a+x.amount,0),NL=db.customers.filter(c=>{const L=limitOf(c);return L>0&&bal(c.id)>=L*0.9}).length;return `<div class="card stat red"><div class="l">${t('todayDebts')}</div><div class="v">${fmt(D)}</div></div><div class="card stat"><div class="l">${t('todayPays')}</div><div class="v">${fmt(P)}</div></div><div class="card stat"><div class="l">${t('nearLimit')}</div><div class="v">${NL}</div></div>`})()}</div>
 <div class="btns"><button class="btn red" data-a="tab" data-v="quick">${t('quick')}</button><button class="btn" data-a="newCust">${t('addCustomer')}</button>${isAdmin()?`<button class="btn sec" data-a="impWa">📥 ${t('importWa')}</button>`:''}<button class="btn sec" data-a="dayReport">📋 ${t('dailyReport')}</button></div>
 <h2>${t('topDebtors')}</h2>
 ${top.length?top.map(r=>custRow(r.c,r.b)).join(''):`<div class="empty">—</div>`}
 <h2>${t('recent')}</h2>
 ${rec.length?`<div class="tw"><table><tbody>${rec.map(x=>{const c=cust(x.cid);return `<tr><td>${esc(x.date)}</td><td>${esc(c?c.name:'?')}</td><td><span class="tag ${x.type==='debt'?'d':'p'}">${t(x.type)}</span></td><td class="num">${fmt(x.amount)}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">${t('noActivity')}</div>`}`}

const remMsg=()=>document.getElementById('remMsg').value;
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

 if(L.length)h+=`<div class="card" style="border-color:var(--amber);background:#fffaf0;margin-bottom:16px"><b>🔔 ${t('dueReminders')} (${L.length})</b>${L.map(c=>`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:140px"><b>${esc(c.name)}</b><br><small class="mute">${fmt(bal(c.id))} · ${esc(c.remindDate)}${c.remindDate<today()?' ('+t('overdue')+')':''}</small></div><button class="btn" data-a="remind" data-id="${c.id}">${t('sendNow')}</button><button class="btn ghost" data-a="snooze" data-id="${c.id}">${t('snooze')}</button><button class="btn ghost" data-a="dismissRem" data-id="${c.id}">${t('skip')}</button></div>`).join('')}</div>`;

/* WhatsApp import: "name amount" lines */
let imp=null,impSkipped=[];
const N2=s=>String(s).toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
function parseMsg(raw){
 let line=nd(raw).replace(/[‎‏‪-‮﻿]/g,'').trim();if(!line)return null;
 let date=today(),sender='',text=line,stamp=false;
 const m=line.match(/^\[?(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4}),?\s+\d{1,2}[:.]\d{2}(?:[:.]\d{2})?\s*(?:[APap]\.?[Mm]\.?|ص|م)?\]?\s*(?:[-–]\s*)?([^:]{1,60}?):\s*(.*)$/);
 if(m){stamp=true;let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;let dd=a,mo=b;if(mo>12){dd=b;mo=a}
  if(mo>=1&&mo<=12&&dd>=1&&dd<=31)date=y+'-'+String(mo).padStart(2,'0')+'-'+String(dd).padStart(2,'0');sender=m[4].trim();text=m[5]}
 else if(/^\[?\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}/.test(line))return null;
 if(/omitted|attached|تم حذف|محذوف/i.test(text))return null;
 const payRe=/(?:^|\s)(?:paid|payment|pay)(?=\s|$)|دفع|سدد|تسديد|سداد|قبض|استلم/i,debtRe=/(?:^|\s)(?:debt|credit|دين|ديـن|آجل|اجل|أجل|ذمة|ذمه|بذمة|بذمته|علية|عليه)(?=\s|$)/gi;
 const type=payRe.test(text)?'payment':'debt';
 text=text.replace(new RegExp(payRe.source,'gi'),' ').replace(debtRe,' ').replace(/IQD|USD|\$|دينار|د\.ع/gi,' ');
 const all=[...text.matchAll(/(\d[\d,]*(?:\.\d+)?)\s*(ألف|الف|k\b)?/gi)];if(!all.length)return null;
 const mm=all[all.length-1];let amt=parseFloat(mm[1].replace(/,/g,''));if(mm[2])amt*=1000;
 let name=(text.slice(0,mm.index)+' '+text.slice(mm.index+mm[0].length)).replace(/[-–—:،,|=*_•]+/g,' ').replace(/\s+/g,' ').trim();
 if(!(amt>0)||!name||!/[A-Za-z؀-ۿ]/.test(name))return null;
 return{raw:line,date,sender,type,amt,name,key:stamp?hp('imp:'+line):''}}
function buildRows(text){const rows=[];impSkipped=[];
 const Ls=text.split(/\r?\n/);for(let i=0;i<Ls.length;i++){let l=Ls[i];if(!l.trim())continue;let p=parseMsg(l);const nx=Ls[i+1];if(!p&&nx&&nx.trim()&&!/^\[?\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}/.test(nx.trim())&&!parseMsg(nx)){const p2=parseMsg(l+' '+nx);if(p2){p=p2;l=l+' '+nx;i++}}if(!p){impSkipped.push(l.trim());continue}
  const q=N2(p.name);let cid='NEW',status='new';
  const ex=db.customers.filter(c=>N2(c.name)===q);
  if(ex.length){cid=ex[0].id;status='match'}
  else{const sim=db.customers.filter(c=>{const n=N2(c.name);return q.length>=3&&n.length>=3&&(n.includes(q)||q.includes(n))});
   if(sim.length===1){cid=sim[0].id;status='similar'}else if(sim.length>1){cid='';status='ambiguous'}}
  const dup=p.key&&db.imported[p.key];
  rows.push({...p,cid,status:dup?'dup':status,inc:!dup&&(status==='match'||status==='new')})}
 return rows}

 return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px"><label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--ink);font-size:15px"><input type="checkbox" style="width:auto" data-i="${k}" data-f="inc" ${r.inc&&!r.blocked?'checked':''} ${r.blocked?'disabled':''}><b>${esc(r.name)}</b> <span class="tag ${cl}">${lab}</span>${r.blocked?`<span class="tag d">${t('limitBlockedTag')}</span>`:''}</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><select style="grid-column:1/-1" data-i="${k}" data-f="cid"><option value="NEW" ${r.cid==='NEW'?'selected':''}>+ ${t('newOpt')}: ${esc(r.name)}</option>${r.cid===''?`<option value="" selected>${t('chooseOpt')}</option>`:''}${db.customers.map(c=>`<option value="${c.id}" ${r.cid===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input data-i="${k}" data-f="amt" inputmode="decimal" value="${fmtN(r.amt)}"><select data-i="${k}" data-f="type"><option value="debt" ${r.type==='debt'?'selected':''}>${t('debt')}</option><option value="payment" ${r.type==='payment'?'selected':''}>${t('payment')}</option></select></div><small class="mute">${esc(r.date)}${r.sender?' · '+esc(r.sender):''}</small></div>`}).join('')}

/* storage: saved online with the db capability, local fallback otherwise */
const COLS=['customers','tx','staff','products','pend'];
function save(){if(cloud){cloudSave();return}try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Storage error: '+e.message)}}
function cloudErr(e){toast(t('saveFail')+((e&&e.code)||''))}
function cloudSave(){const jobs=[];
 COLS.forEach(n=>{const cur={};db[n].forEach(r=>{cur[r.id]=JSON.stringify(r)});const old=shadow[n]||{};
  Object.keys(cur).forEach(id=>{if(old[id]!==cur[id]){const v=JSON.parse(cur[id]);jobs.push(()=>cloud.doc(n+'/'+id).set(v))}});
  Object.keys(old).forEach(id=>{if(!(id in cur))jobs.push(()=>cloud.doc(n+'/'+id).delete())});
  shadow[n]=cur});
 const s=JSON.stringify(db.settings);if(s!==shadow.settings){shadow.settings=s;const v=JSON.parse(s);jobs.push(()=>cloud.doc('meta/settings').set(v))}
 const im=JSON.stringify(db.imported||{});if(im!==shadow.imported){shadow.imported=im;const v={map:JSON.parse(im)};jobs.push(()=>cloud.doc('meta/imported').set(v))}
 jobs.forEach(j=>{writing=writing.then(j).catch(cloudErr)})}
function applyCol(n,snap){const cur={},arr=[];snap.docs.forEach(d=>{const v=d.data();if(v){arr.push(v);cur[d.id]=JSON.stringify(v)}});
 const old=shadow[n];let changed=!old;
 if(old){const a=Object.keys(cur),b=Object.keys(old);changed=a.length!==b.length||a.some(k=>old[k]!==cur[k])}
 shadow[n]=cur;if(changed){db[n]=arr;if(ready)render()}}
function applyMeta(snap){let ch=false;
 snap.docs.forEach(d=>{const v=d.data();if(!v)return;
  if(d.id==='settings'){const x=JSON.stringify(v);if(shadow.settings!==x){shadow.settings=x;db.settings=Object.assign({cur:'IQD',lang:'en',shop:'',defLimit:0},v);ch=true}}
  if(d.id==='imported'){const x=JSON.stringify(v.map||{});if(shadow.imported!==x){shadow.imported=x;db.imported=v.map||{};ch=true}}});
 if(ch&&ready)render()}
function startCloud(c){cloud=c;const got={};const need=COLS.length+1;let slow=null;
 const done=n=>{got[n]=1;if(!ready&&Object.keys(got).length>=need){ready=true;clearTimeout(slow);render()}};
 slow=setTimeout(()=>{if(!ready){loadWarn=true;render()}},10000);
 COLS.forEach(n=>c.collection(n).onSnapshot(snap=>{applyCol(n,snap);done(n)},cloudErr));
 c.collection('meta').onSnapshot(snap=>{applyMeta(snap);done('meta')},cloudErr)}
async function boot(){let c=null;
 try{if(window.claude&&window.claude.use)c=await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),1800000))])}catch(e){}
 if(c)startCloud(c);else{db=load();ready=true;render()}}

 newCust(){modal(custForm())},
 editCust(){modal(custForm(cust(st.cid)))},
 delCust(){ask(t('confirmDelCustomer'),()=>{db.tx=db.tx.filter(x=>x.cid!==st.cid);db.customers=db.customers.filter(c=>c.id!==st.cid);save();st.cid=null;render()})},
 addTx(d){draftItems=[];modal(txForm(d.type,st.cid));limRefresh()},
 delTx(d){ask(t('confirmDelTx'),()=>{db.tx=db.tx.filter(x=>x.id!==d.id);save();render()})},
 fillFull(d){const i=document.querySelector('#modal [name=amount]');i.value=fmtN(d.v);i.focus()},
 logout(){st.lastTx=null;me=null;try{sessionStorage.removeItem('dbme')}catch(e){}st.cid=null;render()},
 products(){modal(productsForm())},
 staff(){modal(staffForm())},
 delProd(d){db.products=db.products.filter(p=>p.id!==d.id);save();modal(productsForm())},
 delStaff(d){const s=db.staff.find(x=>x.id===d.id);if(!s)return;if(s.role==='admin'&&db.staff.filter(x=>x.role==='admin').length===1){toast(t('lastAdmin'));return}ask(t('confirmDelStaff'),()=>{db.staff=db.staff.filter(x=>x.id!==d.id);save();if(me&&me.id===d.id){me=null;try{sessionStorage.removeItem('dbme')}catch(e){}render()}else{render();modal(staffForm())}})},
 addItem(){const n=document.getElementById('itName').value.trim(),q=parseAmt(document.getElementById('itQty').value),p=parseAmt(document.getElementById('itPrice').value);
  if(!n||!(q>0)||!(p>=0)){toast(t('required'));return}draftItems.push({name:n,qty:q,price:p});
  document.getElementById('itName').value='';document.getElementById('itQty').value='1';document.getElementById('itPrice').value='';refreshItems();document.getElementById('itName').focus()},
 rmItem(d){draftItems.splice(+d.k,1);refreshItems()},
 snooze(d){const c=cust(d.id);c.remindDate=addDays(today(),1);save();render()},
 dismissRem(d){advanceRem(cust(d.id),false);render()},
 remind(d){st.rc=(d&&d.id)||st.cid;const c=cust(st.rc),ph=normPhone(c.phone),m=remindMsg(c);
  modal(`<h3>${t('reminder')} — ${esc(c.name)}</h3><div class="mute" style="font-size:13px">${t('phone')}: <b>${esc(c.phone||'—')}</b></div><textarea id="remMsg" rows="5" style="margin-top:8px">${esc(m)}</textarea><div class="btns">${ph?`<a id="waLink" class="btn" data-a="remSent" href="${waHref(ph,m)}" target="_blank" rel="noopener">${t('whatsapp')}</a>`:`<span class="mute">${t('noPhone')}</span>`}<button class="btn sec" data-a="remCopy">${t('copy')}</button><button class="btn ghost" data-a="close">${t('close')}</button></div>`)},
 remSent(){const c=cust(st.rc);advanceRem(c,true);setTimeout(()=>{closeModal();render()},400)},
 remCopy(){copyFrom('remMsg')},
 stCopy(){copyFrom('stText')},
 dlCopy(){copyFrom('dlText')},
 qType(d){st.qt=d.v;document.querySelectorAll('[data-a=qType]').forEach(b=>{const on=b.dataset.v===d.v;b.className='btn '+(on?(d.v==='debt'?'red':''):'ghost')});const sv=document.getElementById('qSave');sv.textContent=t(d.v==='debt'?'saveDebt':'savePay');sv.className='btn '+(d.v==='debt'?'red':'');qRefresh()},
 qToday(){document.getElementById('qDate').value=today()},
 qUndo(){const l=st.lastTx&&db.tx.find(x=>x.id===st.lastTx.id&&(isAdmin()||x.byId===(curUser()||{}).id));if(!l)return;db.tx=db.tx.filter(x=>x.id!==l.id);st.lastTx=null;save();toast(t('undone'));const b=document.getElementById('qTodayBox');if(b)b.innerHTML=qTodayHTML();qRefresh()},
 qLine(){const inp=document.getElementById('qLine'),p=parseMsg(inp.value);if(!p){toast(t('qLineBad'));return}
  const q=N2(p.name);let c=db.customers.find(x=>N2(x.name)===q),sim=null;
  if(!c){const sm=db.customers.filter(x=>{const n=N2(x.name);return q.length>=3&&n.length>=3&&(n.includes(q)||q.includes(n))});if(sm.length>1){toast(t('qLineAmb'));return}if(sm.length===1)sim=sm[0]}
  const go=(cu)=>{if(p.type==='debt'&&(limitCheck(cu.id,p.amt).over||staffCheck('debt',p.amt))){document.getElementById('qCust').value=cu.name;const a=document.getElementById('qAmt');a.value=p.amt.toLocaleString('en-US');st.qt='debt';qRefresh();toast(t('limitBlock'));return}
   db.tx.push(st.lastTx={id:uid(),cid:cu.id,type:p.type,amount:p.amt,date:today(),note:'',items:[],by:(curUser()||{}).name||'',byId:(curUser()||{}).id||'',override:false});save();
   toast(t('qAdded')+': '+cu.name+' · '+t(p.type)+' · '+fmt(p.amt)+' · '+t('newBalance')+' '+fmt(bal(cu.id)));
   inp.value='';document.getElementById('qTodayBox').innerHTML=qTodayHTML();qRefresh();inp.focus()};
  if(c){go(c);return}
  if(sim){ask(t('qLineSim')+': '+sim.name+' ← '+p.name+' · '+t(p.type)+' '+fmt(p.amt)+'?',()=>{closeModal();go(sim)});return}
  ask(t('qLineNew')+': '+p.name+' · '+t(p.type)+' '+fmt(p.amt)+'?',()=>{const nc={id:uid(),created:today(),name:p.name,phone:'',address:'',limit:0,remindDate:'',remindEvery:0};db.customers.push(nc);closeModal();go(nc)})},
 qSave(){const s=qState();if(!s.ok)return;
  if(s.type==='debt'&&s.r.over&&!s.ov){toast(t('limitBlock'));return}
  const date=isAdmin()?(document.getElementById('qDate').value||today()):today(),note=document.getElementById('qNote').value.trim();
  db.tx.push(st.lastTx={id:uid(),cid:s.c.id,type:s.type,amount:s.amt,date,note,items:[],by:(curUser()||{}).name||'',byId:(curUser()||{}).id||'',override:!!(s.ov&&s.r.over)});save();
  toast(t('qAdded')+': '+s.c.name+' · '+fmt(s.amt)+' · '+t('newBalance')+' '+fmt(bal(s.c.id)));
  ['qCust','qAmt','qNote'].forEach(id=>{document.getElementById(id).value=''});document.getElementById('qDate').value=today();
  {const o=document.getElementById('qOvr');if(o)o.checked=false}document.getElementById('qTodayBox').innerHTML=qTodayHTML();qRefresh();document.getElementById('qCust').focus()},
 askYes(){const cb=askCb;askCb=null;closeModal();if(cb)cb()},
 impWa(){modalWide(`<h3>📥 ${t('importWa')}</h3><div class="mute" style="font-size:13px">${t('impHelp')}</div><textarea id="impText" rows="7" placeholder="${esc(t('impPlace'))}" style="margin-top:8px"></textarea><div class="btns"><button class="btn" data-a="impRead">${t('readMsgs')}</button><label class="btn sec" style="margin:0;display:inline-block;cursor:pointer;color:var(--brand)">${t('loadFile')}<input type="file" id="impFile" accept=".txt,text/plain" style="display:none"></label><button class="btn ghost" data-a="close">${t('cancel')}</button></div>`)},
 impRead(){imp=buildRows(document.getElementById('impText').value);if(!imp.length){toast(t('impNone'));return}
  modalWide(`<h3>${t('impPreview')} (${imp.length})</h3><div id="impRows" style="margin-top:8px">${impRowsHTML()}</div>${impSkipped.length?`<details style="margin:8px 0"><summary class="mute">${impSkipped.length} ${t('skippedLines')}</summary><div class="mute" style="font-size:12px">${impSkipped.slice(0,20).map(esc).join('<br>')}</div></details>`:''}<div class="btns"><button class="btn" data-a="impApply">${t('addSelected')}</button><button class="btn ghost" data-a="close">${t('cancel')}</button></div>`)},
 impApply(){impLimitCheck();let n=0,skipped=0;const made={};
  imp.forEach(r=>{if(r.inc&&r.blocked){skipped++;return}if(!r.inc||!r.cid)return;let cid=r.cid;
   if(cid==='NEW'){const k=N2(r.name);if(made[k])cid=made[k];else{const c={id:uid(),created:today(),name:r.name,phone:'',address:'',limit:0,remindDate:'',remindEvery:0};db.customers.push(c);made[k]=c.id;cid=c.id}}
   db.tx.push({id:uid(),cid,type:r.type,amount:r.amt,date:r.date,note:t('viaWa'),items:[],by:r.sender||(curUser()||{}).name||''});
   if(r.key)db.imported[r.key]=1;n++});
  save();closeModal();imp=null;render();toast(n+' '+t('impDone')+(skipped?' · '+skipped+' '+t('limitBlockedTag'):''))},
 close:closeModal,
 dayReport(){dayReport()},
 reqApproval(){const f=document.querySelector('#modal form[data-f=tx]');if(!f)return;const c=cust(f.dataset.cid),a=parseAmt(f.querySelector('[name=amount]').value);if(!c||!(a>0)){toast(t('required'));return}
  addPend({cid:c.id,amount:a,note:f.querySelector('[name=note]').value.trim(),items:draftItems.slice()});draftItems=[];closeModal();render()},
 qReq(){const s=qState();if(!s.c||!(s.amt>0))return;addPend({cid:s.c.id,amount:s.amt,note:document.getElementById('qNote').value.trim(),items:[]});render()},
 pendOk(d){if(!isAdmin())return;const p=db.pend.find(x=>x.id===d.id);if(!p)return;
  if(cust(p.cid))db.tx.push({id:uid(),cid:p.cid,type:'debt',amount:p.amount,date:p.date||today(),note:p.note||'',items:p.items||[],by:p.by||'',byId:p.byId||'',override:limitCheck(p.cid,p.amount).over,approvedBy:(curUser()||{}).name||'Admin'});
  db.pend=db.pend.filter(x=>x.id!==d.id);save();toast(t('approved'));render()},
 pendNo(d){const p=db.pend.find(x=>x.id===d.id),u=curUser();if(!p||!(isAdmin()||(u&&p.byId===u.id)))return;db.pend=db.pend.filter(x=>x.id!==d.id);save();toast(t('rejected'));render()},
 editStaff(d){const s=db.staff.find(x=>x.id===d.id),f=document.querySelector('#modal form[data-f=staff]');if(!s||!f)return;const q=n=>f.querySelector('[name='+n+']');
  q('name').value=s.name;q('pin').value='';if(q('role').querySelector('option[value='+s.role+']'))q('role').value=s.role;q('maxEntry').value=fmtN(s.maxEntry);q('maxDay').value=fmtN(s.maxDay);q('pin').focus()},
 print:statement,
 settings(){modal(settingsForm())},
 backup(){download('debt-book-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');closeModal()},
 restore(){const f=document.getElementById('file');f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.customers||!d.tx)throw 0;const nv=norm(d);ask(t('confirmRestore'),()=>{db=nv;save();closeModal();render();toast(t('restoreOk'))})}catch(e){toast(t('restoreBad'))}};r.readAsText(f.files[0])};f.click()},
 csv(){const h=[t('name'),t('phone'),t('balance')+' ('+db.settings.cur+')'];const r=db.customers.map(c=>[c.name,c.phone,bal(c.id)]);download('balances-'+today()+'.csv','\ufeff'+[h,...r].map(l=>l.map(csvCell).join(',')).join('\n'),'text/csv');closeModal()},
 csvtx(){const h=[t('date'),t('name'),'Type',t('amount')+' ('+db.settings.cur+')',t('note')];const r=[...db.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,(cust(x.cid)||{}).name,x.type,x.amount,x.note]);download('transactions-'+today()+'.csv','\ufeff'+[h,...r].map(l=>l.map(csvCell).join(',')).join('\n'),'text/csv');closeModal()}
};
document.addEventListener('click',e=>{if(e.target.id==='modalBg')return closeModal();const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;const p=e.target.selectionStart;render();const i=document.getElementById('q');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='ovr'||el.id==='qOvr'){limRefresh();qRefresh();return}
 if(el.id==='flt'){st.filter=el.value;render();return}
 if(el.id==='srt'){st.sort=el.value;render();return}
 if(el.id==='impFile'){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('impText').value=r.result};r.readAsText(f);return}
 if(imp&&el.dataset&&el.dataset.i!==undefined){const row=imp[+el.dataset.i],f=el.dataset.f;
  if(f==='inc')row.inc=el.checked;
  else if(f==='cid'){row.cid=el.value;if(el.value)row.inc=true;document.getElementById('impRows').innerHTML=impRowsHTML()}
  else if(f==='amt'){const a=parseAmt(el.value);if(a>0)row.amt=a;else el.value=row.amt}
  else if(f==='type')row.type=el.value;document.getElementById('impRows').innerHTML=impRowsHTML()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qLine'){e.preventDefault();A.qLine();return}if(e.key==='Escape')closeModal();if(e.key==='Enter'&&['itName','itQty','itPrice'].includes(e.target.id)){e.preventDefault();A.addItem()}});
function fmtN(n){n=+n;return n>0?n.toLocaleString('en-US',{maximumFractionDigits:2}):''}
function fmtAmt(el){const v=el.value,pos=el.selectionStart,keep=v.slice(0,pos).replace(/[^0-9٠-٩.]/g,'').length;let r=v.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9.]/g,'');const k=r.indexOf('.');let ip=k<0?r:r.slice(0,k),dp=k<0?'':'.'+r.slice(k+1).replace(/\./g,'');ip=ip.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,',');const out=ip+dp;el.value=out;let n=0,i=0;while(i<out.length&&n<keep){if(/[0-9.]/.test(out[i]))n++;i++}try{el.setSelectionRange(i,i)}catch(x){}}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.phone!==undefined){const v=e.target.value,n=nd(v).replace(/\D/g,'').slice(0,11);if(v!==n)e.target.value=n}if(e.target.id==='qAmt'||(e.target.dataset&&e.target.dataset.amt!==undefined))fmtAmt(e.target);if(e.target.id==='qCust'||e.target.id==='qAmt')qRefresh();if(e.target.name==='amount'&&e.target.closest&&e.target.closest('form[data-f=tx]'))limRefresh();if(e.target.id==='remMsg'){const a=document.getElementById('waLink');if(a)a.href=waHref(normPhone(cust(st.rc).phone),e.target.value)}if(e.target.id==='itName'){const p=db.products.find(x=>x.name.toLowerCase()===e.target.value.trim().toLowerCase());if(p)document.getElementById('itPrice').value=p.price}});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
 if(f==='cust'){const name=d.name.trim();if(!name){toast(t('required'));return}const lim=parseAmt(d.limit),ph=nd(d.phone).replace(/\D/g,'');if(ph&&(ph.length<10||ph.length>11)){toast(t('phoneBad'));return}const o={name,phone:ph,address:d.address.trim(),limit:isFinite(lim)&&lim>0?lim:0,remindDate:d.remindDate||'',remindEvery:Math.max(0,parseInt(d.remindEvery)||0)};
  if(!isAdmin())o.limit=d.id?(cust(d.id).limit||0):0;
  if(d.id){Object.assign(cust(d.id),o)}else{const c={id:uid(),created:today(),...o};db.customers.push(c);st.view='customers';st.cid=c.id}
  save();closeModal();render()}
 if(f==='tx'){const a=parseAmt(d.amount);if(!(a>0)){toast(t('required'));return}const c=cust(st.cid);
  const commit=(ov)=>{db.tx.push({id:uid(),cid:c.id,type:d.type,amount:a,date:isAdmin()?d.date:today(),note:d.note.trim(),items:d.type==='debt'?draftItems.slice():[],by:(curUser()||{}).name||'',byId:(curUser()||{}).id||'',override:!!ov});draftItems=[];if(d.remind)c.remindDate=d.remind;save();closeModal();render()};
  if(staffCheck(d.type,a)){toast(t('limitBlock'));return}const over=d.type==='debt'&&limitCheck(c.id,a).over;if(over&&!(isAdmin()&&d.ovr)){toast(t('limitBlock'));return}commit(over)}
 if(f==='login'){const s=db.staff.find(x=>x.id===d.id);if(s&&s.pin===hp('dbk:'+nd(d.pin))){st.lastTx=null;me={id:s.id};try{sessionStorage.setItem('dbme',JSON.stringify(me))}catch(e){}closeModal();render()}else toast(t('wrongPin'))}
 if(f==='prod'){const name=d.name.trim(),p=parseAmt(d.price);if(!name||!(p>=0)){toast(t('required'));return}const x=db.products.find(y=>y.name.toLowerCase()===name.toLowerCase());if(x)x.price=p;else db.products.push({id:uid(),name,price:p});db.products.sort((a,b)=>a.name.localeCompare(b.name));save();modal(productsForm())}
 if(f==='staff'){const name=d.name.trim(),pin=nd(d.pin);if(!name)return;const ex=db.staff.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!(ex&&!pin)&&!/^\d{4,}$/.test(pin)){toast(t('pinShort'));return}
  const first=!staffOn();let s=ex;const role=first?'admin':d.role,mE=parseAmt(d.maxEntry),mD=parseAmt(d.maxDay),lim={maxEntry:mE>0?mE:0,maxDay:mD>0?mD:0};
  if(s){if(s.role==='admin'&&role!=='admin'&&db.staff.filter(x=>x.role==='admin').length===1){toast(t('lastAdmin'));return}if(pin)s.pin=hp('dbk:'+pin);s.role=role;Object.assign(s,lim)}
  else{s={id:uid(),name,pin:hp('dbk:'+pin),role,...lim};db.staff.push(s)}
  if(first){me={id:s.id};try{sessionStorage.setItem('dbme',JSON.stringify(me))}catch(e){}}
  save();render();modal(staffForm())}
 if(f==='settings'){db.settings.shop=d.shop.trim();db.settings.cur=d.cur;const dl=parseAmt(d.defLimit);db.settings.defLimit=dl>0?dl:0;save();closeModal();render()}
});
boot();
</script>
</html>
